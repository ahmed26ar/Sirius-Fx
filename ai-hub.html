<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محلل الصفقة الذكي | Sirius Fx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo_new.png" type="image/png">
  <style>
    :root {
      --sky: #00d4ff;
      --sky-dim: #0099cc;
      --sky-glow: rgba(0, 212, 255, 0.25);
      --black: #000000;
      --white: #ffffff;
      --gray-100: #f5f7fa;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --gray-900: #0a0a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(0, 212, 255, 0.15);
      --text: var(--white);
      --text-muted: #94a3b8;
      --bg: var(--black);
      --bg-alt: #050508;
      --nav-bg: rgba(0, 0, 0, 0.85);
      --shadow: 0 8px 32px rgba(0, 212, 255, 0.08);
      --font-ar: 'Cairo', sans-serif;
      --font-en: 'Inter', sans-serif;
      --radius: 12px;
      --transition: 0.3s ease;
    }

    [data-theme="light"] {
      --bg: var(--gray-100);
      --bg-alt: var(--white);
      --text: var(--gray-900);
      --text-muted: var(--gray-600);
      --card-bg: var(--white);
      --border: rgba(0, 153, 204, 0.2);
      --nav-bg: rgba(255, 255, 255, 0.92);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ar);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, var(--sky-glow), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
    .accent { color: var(--sky); }

    /* Nav */
    .navbar { position: sticky; top: 0; z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .logo-text { font-size: 1.45rem; font-weight: 800; letter-spacing: 1.5px; line-height: 1; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .logo-text .accent { color: var(--sky); font-style: italic; }
    .logo-img { width: 44px; height: 44px; object-fit: cover; border-radius: 50%; background: #000; border: 1.5px solid rgba(0,212,255,0.35); box-shadow: 0 0 14px rgba(0,212,255,0.45); flex-shrink: 0; }
    .nav-links { display: flex; list-style: none; gap: 8px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all var(--transition); }
    .nav-links a:hover, .nav-links a.active { color: var(--sky); background: var(--sky-glow); }
    .nav-controls { display: flex; align-items: center; gap: 8px; }
    .ctrl-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
    .ctrl-btn:hover { border-color: var(--sky); color: var(--sky); }
    [data-theme="dark"] .icon-moon, [data-theme="light"] .icon-sun { display: none; }
    .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; }
    .nav-toggle span { width: 24px; height: 2px; background: var(--text); transition: var(--transition); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 10px;
      font-weight: 700; font-size: 14px; text-decoration: none; border: 2px solid transparent;
      cursor: pointer; transition: all var(--transition); font-family: inherit;
    }
    .btn-primary { background: var(--sky); color: var(--black); border-color: var(--sky); }
    .btn-primary:hover { background: var(--sky-dim); border-color: var(--sky-dim); transform: translateY(-2px); box-shadow: 0 8px 24px var(--sky-glow); }
    .btn-outline { background: transparent; color: var(--sky); border-color: var(--sky); }
    .btn-outline:hover { background: var(--sky-glow); }

    /* Page Header */
    .page-header { text-align: center; padding: 40px 0 20px; }
    .page-header h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; background: linear-gradient(135deg, var(--text) 0%, var(--sky) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
    .page-header p { color: var(--text-muted); max-width: 600px; margin: 0 auto; font-size: 15px; }

    /* Main Form Card */
    .analyzer-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; box-shadow: 0 16px 48px var(--sky-glow); backdrop-filter: blur(12px);
      margin: 20px 0 40px; position: relative;
    }
    .analyzer-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, var(--sky), transparent 50%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.6;
    }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 13px; font-weight: 700; color: var(--sky); text-transform: uppercase; letter-spacing: 1px; }
    .form-group input, .form-group select {
      padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
      transition: all var(--transition);
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-glow); }
    .full-width { grid-column: 1 / -1; }
    .btn-analyze { width: 100%; padding: 16px; font-size: 18px; justify-content: center; margin-top: 8px; }

    /* Result Area */
    .result-container { margin-top: 24px; display: none; }
    .result-container.show { display: block; animation: fadeInUp 0.5s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .score-circle {
      width: 120px; height: 120px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; margin: 0 auto 20px;
      font-size: 2.5rem; font-weight: 800; font-family: var(--font-en);
      background: conic-gradient(var(--sky) calc(var(--score) * 1%), transparent 0);
      box-shadow: 0 0 30px var(--sky-glow); position: relative;
    }
    .score-inner {
      width: 100px; height: 100px; border-radius: 50%; background: var(--bg);
      display: flex; align-items: center; justify-content: center; position: absolute;
    }
    .verdict { text-align: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    .verdict.good { color: #22c55e; } .verdict.caution { color: #f59e0b; } .verdict.avoid { color: #ef4444; }
    .verdict-text { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }

    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .detail-card {
      background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; text-align: center;
    }
    .detail-icon { font-size: 1.8rem; margin-bottom: 6px; }
    .detail-title { color: var(--text-muted); font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
    .detail-value { font-family: var(--font-en); font-weight: 700; font-size: 14px; }
    .detail-value.good { color: #22c55e; } .detail-value.warn { color: #f59e0b; } .detail-value.bad { color: #ef4444; }

    .pattern-alert {
      background: rgba(0,212,255,0.1); border: 1px solid var(--sky); border-radius: 8px;
      padding: 12px 20px; margin-top: 16px; display: flex; align-items: center; gap: 12px;
    }
    .pattern-alert .icon { font-size: 1.5rem; }
    .pattern-alert .text { font-size: 13px; color: var(--sky); }

    /* Footer */
    .footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 60px; }

    @media (max-width: 768px) {
      .nav-toggle { display: flex; }
      .nav-links { position: fixed; top: 72px; inset-inline: 0; background: var(--nav-bg); flex-direction: column; padding: 24px; border-bottom: 1px solid var(--border); transform: translateY(-120%); opacity: 0; pointer-events: none; transition: all var(--transition); }
      .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: all; }
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo_new.png" alt="Sirius Fx" class="logo-img" width="44" height="44" onerror="this.onerror=null;this.src='assets/logo_new.png';">
        <span class="logo-text">Sirius&nbsp;<span class="accent">Fx</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="ai-hub.html" class="active">مركز AI</a></li>
        <li><a href="index.html#tools">الأدوات</a></li>
        <li><a href="index.html#chart">الشارت</a></li>
      </ul>
      <div class="nav-controls">
        <button class="ctrl-btn" id="themeToggle"><span class="icon-sun">☀️</span><span class="icon-moon">🌙</span></button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>📊 محلل الصفقة الذكي</h1>
      <p>أدخل تفاصيل صفقتك المحتملة، وسيقوم المحلل بتقييمها من جميع الزوايا ويمنحك توصية واضحة.</p>
    </div>

    <div class="analyzer-card">
      <div class="form-grid">
        <div class="form-group">
          <label>💰 الزوج / الأصل</label>
          <input type="text" id="symbol" value="EUR/USD" placeholder="مثال: EUR/USD">
        </div>
        <div class="form-group">
          <label>📈 نوع الصفقة</label>
          <select id="type"><option value="buy">شراء</option><option value="sell">بيع</option></select>
        </div>
        <div class="form-group">
          <label>📊 حجم رأس المال ($)</label>
          <input type="number" id="capital" value="1000" min="1" step="1">
        </div>
        <div class="form-group">
          <label>⚠️ نسبة المخاطرة %</label>
          <input type="number" id="riskPercent" value="2" min="0.1" max="100" step="0.1">
        </div>
        <div class="form-group">
          <label>🎯 نقاط وقف الخسارة</label>
          <input type="number" id="stopLoss" value="20" min="1" step="1">
        </div>
        <div class="form-group">
          <label>🏆 نقاط الهدف</label>
          <input type="number" id="takeProfit" value="40" min="1" step="1">
        </div>
        <div class="form-group">
          <label>🌐 الجلسة</label>
          <select id="session"><option value="london">لندن</option><option value="ny">نيويورك</option><option value="asia">آسيا</option><option value="overlap">تداخل</option></select>
        </div>
        <div class="form-group">
          <label>📉 الاتجاه العام</label>
          <select id="trend"><option value="with">مع الاتجاه</option><option value="against">عكس الاتجاه</option><option value="range">عرضي</option></select>
        </div>
        <div class="form-group">
          <label>📊 سعر الدخول</label>
          <input type="number" id="entryPrice" value="1.0850" step="0.00001">
        </div>
        <div class="form-group">
          <label>📊 سعر الإغلاق السابق 1</label>
          <input type="number" id="close1" value="1.0830" step="0.00001">
        </div>
        <div class="form-group">
          <label>📊 سعر الإغلاق السابق 2</label>
          <input type="number" id="close2" value="1.0810" step="0.00001">
        </div>
        <div class="form-group">
          <label>📊 سعر الإغلاق السابق 3</label>
          <input type="number" id="close3" value="1.0800" step="0.00001">
        </div>
      </div>
      <button class="btn btn-primary btn-analyze" onclick="analyzeTrade()">🔍 حلل الصفقة الآن</button>

      <div class="result-container" id="result">
        <div class="score-circle" id="scoreCircle"><div class="score-inner"><span id="scoreText">0</span>%</div></div>
        <div class="verdict" id="verdict"></div>
        <p class="verdict-text" id="verdictText"></p>
        <div class="details-grid" id="detailsGrid"></div>
        <div id="patternAlert"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 Sirius Fx. للتعليم فقط — ليس نصيحة استثمارية.</p>
  </footer>

  <script>
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    themeToggle?.addEventListener('click', () => {
      const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
    html.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    navToggle?.addEventListener('click', () => navLinks.classList.toggle('open'));
    navLinks?.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('open')));

    function detectCandlestick(entry, close1) {
      const diff = Math.abs(entry - close1);
      if (diff === 0) return null;
      const body = diff;
      const upperWick = Math.max(entry, close1) - Math.min(entry, close1); // Simplified
      if (body < 0.0001) return { name: 'Doji', meaning: 'تردد في السوق — انتظر تأكيداً' };
      if (entry > close1 && (entry - close1) > 0.0003) return { name: 'مطرقة (Hammer) صاعدة', meaning: 'إشارة انعكاس محتملة للأعلى' };
      if (close1 > entry && (close1 - entry) > 0.0003) return { name: 'شهاب (Shooting Star)', meaning: 'إشارة انعكاس محتملة للأسفل' };
      return null;
    }

    function analyzeTrade() {
      const symbol = document.getElementById('symbol').value || 'EUR/USD';
      const type = document.getElementById('type').value;
      const capital = parseFloat(document.getElementById('capital').value) || 1000;
      const riskPercent = parseFloat(document.getElementById('riskPercent').value) || 2;
      const stopLoss = parseFloat(document.getElementById('stopLoss').value) || 20;
      const takeProfit = parseFloat(document.getElementById('takeProfit').value) || 40;
      const session = document.getElementById('session').value;
      const trend = document.getElementById('trend').value;
      const entryPrice = parseFloat(document.getElementById('entryPrice').value) || 0;
      const c1 = parseFloat(document.getElementById('close1').value) || 0;
      const c2 = parseFloat(document.getElementById('close2').value) || 0;
      const c3 = parseFloat(document.getElementById('close3').value) || 0;

      // 1. Risk:Reward Score (max 30)
      const rr = takeProfit / stopLoss;
      let rrScore = 0;
      if (rr >= 3) rrScore = 30;
      else if (rr >= 2) rrScore = 25;
      else if (rr >= 1.5) rrScore = 15;
      else rrScore = 5;

      // 2. Trend Score (max 25)
      let trendScore = 0;
      if (trend === 'with') trendScore = 25;
      else if (trend === 'range') trendScore = 15;
      else trendScore = 5;

      // 3. Session Score (max 20)
      let sessionScore = 0;
      if (session === 'london' || session === 'overlap') sessionScore = 20;
      else if (session === 'ny') sessionScore = 15;
      else sessionScore = 10;

      // 4. Momentum Score (max 25) - Using 3 closing prices
      let momentumScore = 15; // Neutral
      if (c1 && c2 && c3) {
        const mom = (c1 - c3) / Math.abs(c3 || 1);
        if (type === 'buy' && mom > 0.0005) momentumScore = 25;
        else if (type === 'sell' && mom < -0.0005) momentumScore = 25;
        else if (Math.abs(mom) < 0.0002) momentumScore = 15;
        else momentumScore = 8;
      }

      const totalScore = rrScore + trendScore + sessionScore + momentumScore;
      const scorePercent = Math.min(100, Math.max(0, totalScore));

      // Position Size Calculation
      const riskAmount = capital * (riskPercent / 100);
      const pipValue = 0.0001; // Simplified for major pairs
      const positionSize = riskAmount / (stopLoss * pipValue * 100000);
      const lotSize = Math.round(positionSize * 100) / 100;

      // Display Results
      const resultDiv = document.getElementById('result');
      resultDiv.classList.add('show');
      resultDiv.scrollIntoView({ behavior: 'smooth' });

      document.getElementById('scoreText').textContent = scorePercent;
      document.getElementById('scoreCircle').style.setProperty('--score', scorePercent);

      const verdictEl = document.getElementById('verdict');
      const verdictText = document.getElementById('verdictText');
      
      let verdict, vText, vClass;
      if (scorePercent >= 75) {
        verdict = '✅ صفقة موصى بها بقوة';
        vText = 'جميع المؤشرات تدعم هذه الصفقة. يمكنك الدخول بثقة مع الالتزام بإدارة المخاطر.';
        vClass = 'good';
      } else if (scorePercent >= 55) {
        verdict = '⚠️ صفقة مقبولة بحذر';
        vText = 'الصفقة جيدة لكن بعض العوامل تحتاج مراقبة. التزم بوقف الخسارة.';
        vClass = 'caution';
      } else {
        verdict = '⛔ يفضل تجنب الصفقة';
        vText = 'المخاطر مرتفعة مقارنة بالعائد. انتظر إعداداً أفضل.';
        vClass = 'avoid';
      }
      verdictEl.textContent = verdict;
      verdictEl.className = `verdict ${vClass}`;
      verdictText.textContent = vText;

      document.getElementById('detailsGrid').innerHTML = `
        <div class="detail-card"><div class="detail-icon">📊</div><div class="detail-title">نسبة العائد/المخاطرة</div><div class="detail-value ${rr >= 2 ? 'good' : 'warn'}">1:${rr.toFixed(1)}</div></div>
        <div class="detail-card"><div class="detail-icon">💵</div><div class="detail-title">حجم العقد المناسب</div><div class="detail-value good">${lotSize.toFixed(2)} لوت</div></div>
        <div class="detail-card"><div class="detail-icon">💸</div><div class="detail-title">قيمة المخاطرة</div><div class="detail-value warn">${riskAmount.toFixed(2)} $</div></div>
        <div class="detail-card"><div class="detail-icon">🌐</div><div class="detail-title">تقييم الجلسة</div><div class="detail-value ${session === 'asia' ? 'warn' : 'good'}">${session === 'london' || session === 'overlap' ? 'ممتازة' : 'متوسطة'}</div></div>
        <div class="detail-card"><div class="detail-icon">📉</div><div class="detail-title">تقييم الاتجاه</div><div class="detail-value ${trend === 'with' ? 'good' : 'warn'}">${trend === 'with' ? 'ممتاز' : trend === 'range' ? 'محايد' : 'ضعيف'}</div></div>
        <div class="detail-card"><div class="detail-icon">⚡</div><div class="detail-title">تقييم الزخم</div><div class="detail-value ${momentumScore >= 20 ? 'good' : momentumScore >= 15 ? 'warn' : 'bad'}">${momentumScore >= 20 ? 'قوي' : momentumScore >= 15 ? 'محايد' : 'ضعيف'}</div></div>
      `;

      const pattern = detectCandlestick(entryPrice, c1);
      const patternDiv = document.getElementById('patternAlert');
      if (pattern) {
        patternDiv.innerHTML = `<span class="icon">🕯️</span><span class="text">تم كشف نمط: <strong>${pattern.name}</strong> — ${pattern.meaning}</span>`;
        patternDiv.style.display = 'flex';
      } else {
        patternDiv.innerHTML = '';
        patternDiv.style.display = 'none';
      }
    }
  </script>
</body>
</html>
