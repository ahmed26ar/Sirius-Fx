<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000010"/>
      <stop offset="100%" stop-color="#001a2e"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <!-- Sirius star - 4-pointed star -->
  <path d="M256 80 L270 200 L256 180 L242 200 Z" fill="url(#star)" opacity="0.6"/>
  <path d="M256 432 L242 312 L256 332 L270 312 Z" fill="url(#star)" opacity="0.6"/>
  <path d="M80 256 L200 242 L180 256 L200 270 Z" fill="url(#star)" opacity="0.6"/>
  <path d="M432 256 L312 270 L332 256 L312 242 Z" fill="url(#star)" opacity="0.6"/>
  <!-- Center star -->
  <polygon points="256,120 276,200 256,220 236,200" fill="url(#star)"/>
  <polygon points="256,392 236,312 256,292 276,312" fill="url(#star)"/>
  <polygon points="120,256 200,236 220,256 200,276" fill="url(#star)"/>
  <polygon points="392,256 312,276 292,256 312,236" fill="url(#star)"/>
  <!-- Center glow -->
  <circle cx="256" cy="256" r="40" fill="url(#star)" opacity="0.9"/>
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
  <!-- S & F text -->
  <text x="256" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="800" letter-spacing="6" fill="#ffffff">S F</text>
</svg>
