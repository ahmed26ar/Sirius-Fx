<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sirius Fx — الإشارات</title>
  <link rel="icon" href="assets/logo_new_png.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #00d4ff;
      --sky-glow: rgba(0,212,255,0.2);
      --bg: #000010;
      --card: rgba(10,15,30,0.75);
      --border: rgba(0,212,255,0.18);
      --text: #ffffff;
      --muted: #94a3b8;
      --buy: #22c55e;
      --sell: #ef4444;
      --win: #22c55e;
      --loss: #ef4444;
      --active: #00d4ff;
      --pending: #f59e0b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* خلفية فضائية */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,212,255,0.12), transparent 60%),
        radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 70% 15%, rgba(0,212,255,0.6), transparent),
        radial-gradient(1px 1px at 85% 70%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 25% 80%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 55% 90%, rgba(0,212,255,0.4), transparent),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5), transparent);
      pointer-events: none;
      z-index: 0;
      animation: twinkle 6s infinite alternate;
    }
    @keyframes twinkle { 0%{opacity:.5} 100%{opacity:1} }
    body > * { position: relative; z-index: 1; }

    /* ===== NAVBAR ===== */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 68px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); }
    .nav-logo span {
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-style: italic;
      font-size: 1.2rem; color: #fff; letter-spacing: 1px;
    }
    .nav-logo span em { color: var(--sky); font-style: italic; }
    .nav-back {
      color: var(--sky); text-decoration: none; font-size: 13px;
      font-weight: 600; display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border: 1px solid var(--border);
      border-radius: 8px; transition: all .25s;
    }
    .nav-back:hover { background: var(--sky-glow); }

    /* ===== HEADER ===== */
    .page-header {
      text-align: center; padding: 56px 24px 40px;
    }
    .page-tag {
      display: inline-block; color: var(--sky);
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 12px;
    }
    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800; margin-bottom: 10px;
    }
    .page-title span { color: var(--sky); }
    .page-desc { color: var(--muted); font-size: 14px; }

    /* شريط الإحصائيات */
    .stats-bar {
      display: flex; justify-content: center; gap: 32px;
      flex-wrap: wrap; margin: 0 auto 48px;
      max-width: 700px; padding: 20px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .stat-item { text-align: center; }
    .stat-item .num {
      display: block; font-size: 1.6rem; font-weight: 800;
      font-family: 'Inter', monospace; color: var(--sky);
    }
    .stat-item .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ===== LIVE DOT ===== */
    .live-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 50px; padding: 5px 14px; font-size: 12px;
      font-weight: 700; color: #22c55e; margin-bottom: 32px;
    }
    .dot {
      width: 7px; height: 7px; background: #22c55e;
      border-radius: 50%; animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }

    /* ===== GRID ===== */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    .signals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding-bottom: 60px;
    }

    /* ===== SIGNAL CARD ===== */
    .signal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(16px);
      transition: all .35s ease;
      position: relative;
      overflow: hidden;
      animation: cardIn .4s ease forwards;
      opacity: 0;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .signal-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--sky), transparent);
      opacity: 0; transition: opacity .3s;
    }
    .signal-card:hover { transform: translateY(-4px); border-color: rgba(0,212,255,0.45); box-shadow: 0 12px 40px rgba(0,212,255,0.12); }
    .signal-card:hover::before { opacity: 1; }

    /* شريط اللون حسب الاتجاه */
    .signal-card.buy  { border-right: 3px solid var(--buy); }
    .signal-card.sell { border-right: 3px solid var(--sell); }

    /* الـ status */
    .signal-card.status-win  { border-top: 2px solid var(--win); }
    .signal-card.status-loss { border-top: 2px solid var(--loss); }

    .card-top {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 18px;
    }
    .pair {
      font-family: 'Inter', monospace;
      font-size: 1.25rem; font-weight: 800;
      color: var(--text); letter-spacing: 1px;
    }
    .direction-badge {
      font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 800;
      padding: 5px 14px; border-radius: 50px;
      letter-spacing: 1px;
    }
    .direction-badge.buy  { background: rgba(34,197,94,0.15); color: var(--buy); border: 1px solid rgba(34,197,94,0.4); }
    .direction-badge.sell { background: rgba(239,68,68,0.15);  color: var(--sell); border: 1px solid rgba(239,68,68,0.4); }

    .card-levels {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .level-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 10px;
      text-align: center;
    }
    .level-box .level-lbl {
      font-size: 10px; color: var(--muted);
      font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 5px;
    }
    .level-box .level-val {
      font-family: 'Inter', monospace;
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .level-box.entry .level-val { color: var(--sky); }
    .level-box.sl    .level-val { color: var(--sell); }
    .level-box.tp    .level-val { color: var(--buy); }

    /* الـ RR تلقائي */
    .rr-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .rr-badge {
      font-family: 'Inter', monospace; font-size: 11px; font-weight: 700;
      background: rgba(0,212,255,0.1); color: var(--sky);
      border: 1px solid rgba(0,212,255,0.25); border-radius: 6px;
      padding: 3px 10px;
    }
    .card-time {
      font-size: 11px; color: var(--muted);
      font-family: 'Inter', monospace;
    }

    /* شريط الحالة */
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06);
    }
    .status-badge {
      font-size: 11px; font-weight: 700; padding: 4px 12px;
      border-radius: 50px; font-family: 'Inter', sans-serif;
    }
    .status-badge.active  { background: rgba(0,212,255,0.12); color: var(--active); border: 1px solid rgba(0,212,255,0.3); }
    .status-badge.pending { background: rgba(245,158,11,0.12); color: var(--pending); border: 1px solid rgba(245,158,11,0.3); }
    .status-badge.win     { background: rgba(34,197,94,0.12);  color: var(--win);    border: 1px solid rgba(34,197,94,0.3); }
    .status-badge.loss    { background: rgba(239,68,68,0.12);  color: var(--loss);   border: 1px solid rgba(239,68,68,0.3); }
    .status-badge.closed  { background: rgba(148,163,184,0.1); color: var(--muted);  border: 1px solid rgba(148,163,184,0.2); }

    .comment-text {
      font-size: 12px; color: var(--muted);
      font-style: italic; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* حالة فارغة */
    .empty-state {
      text-align: center; padding: 80px 20px; color: var(--muted);
      grid-column: 1/-1;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: .5; }
    .empty-state p { font-size: 15px; }

    /* ===== FOOTER ===== */
    footer {
      text-align: center; padding: 28px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
    }

    /* Responsive */
    @media(max-width:600px){
      .stats-bar { gap: 20px; padding: 16px 20px; }
      nav { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="star-field-layer"></div>
  <div class="floating-orbs-container"></div>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="assets/logo_new_png.png" alt="Sirius Fx">
      <span>Sirius <em>Fx</em></span>
    </a>
    <a href="index.html" class="nav-back">← الرئيسية</a>
  </nav>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-tag"><span data-icon="signals"></span> Live Signals</div>
    <h1 class="page-title">إشارات <span>التداول</span></h1>
    <p class="page-desc">الصفقات المنشورة مباشرة من فريق Sirius Fx</p>
  </div>

  <div class="container">

    <!-- إحصائيات -->
    <div style="text-align:center; margin-bottom:20px;">
      <div class="live-badge"><div class="dot"></div> مباشر الآن</div>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat-item"><span class="num" id="statTotal">0</span><div class="lbl">إجمالي الإشارات</div></div>
      <div class="stat-item"><span class="num" id="statActive" style="color:#00d4ff">0</span><div class="lbl">نشطة</div></div>
      <div class="stat-item"><span class="num" id="statWin" style="color:#22c55e">0</span><div class="lbl">✅ Win</div></div>
      <div class="stat-item"><span class="num" id="statWR" style="color:#22c55e">—</span><div class="lbl">نسبة الربح</div></div>
    </div>

    <!-- بطاقات الإشارات -->
    <div class="signals-grid" id="signalsGrid">
      <div class="empty-state">
        <div class="icon"><span data-icon="signals"></span></div>
        <p>جاري تحميل الإشارات...</p>
      </div>
    </div>

  </div>

  <footer>© 2026 Sirius Fx — للأغراض التعليمية فقط. التداول ينطوي على مخاطر.</footer>

  <script src="js/icon.js"></script>
  <script src="js/effects.js"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ضع هنا بيانات مشروعك من Firebase Console
    const firebaseConfig = {
      apiKey:            "AIzaSyAzw8QculXm6UVwWsll0Pmf5ssjlh94u7Q",
      authDomain:        "siriusfx-8d0a4.firebaseapp.com",
      databaseURL:       "https://siriusfx-8d0a4-default-rtdb.firebaseio.com",
      projectId:         "siriusfx-8d0a4",
      storageBucket:     "siriusfx-8d0a4.firebasestorage.app",
      messagingSenderId: "966126767772",
      appId:             "1:966126767772:web:1d9db795661c760d962759"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    function calcRR(entry, sl, tp, dir){
      const e = parseFloat(entry), s = parseFloat(sl), t = parseFloat(tp);
      if(!e||!s||!t) return null;
      const risk   = Math.abs(e - s);
      const reward = Math.abs(t - e);
      if(!risk) return null;
      return (reward / risk).toFixed(2);
    }

    function timeAgo(ts){
      const diff = Date.now() - ts;
      const m = Math.floor(diff/60000);
      if(m < 1)  return 'الآن';
      if(m < 60) return `منذ ${m} دقيقة`;
      const h = Math.floor(m/60);
      if(h < 24) return `منذ ${h} ساعة`;
      return `منذ ${Math.floor(h/24)} يوم`;
    }

    function statusLabel(s){
      const map = { active:'نشط 🔵', pending:'معلق ⏳', win:'✅ Win', loss:'❌ Loss', closed:'مغلق' };
      return map[s] || s;
    }

    function renderCards(signals){
      const grid = document.getElementById('signalsGrid');
      if(!signals || signals.length === 0){
        grid.innerHTML = `<div class="empty-state"><div class="icon"><span data-icon="signals"></span></div><p>لا توجد إشارات حالياً، ترقب الإشارات القادمة!</p></div>`;
        return;
      }

      // ترتيب من الأحدث
      signals.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

      grid.innerHTML = signals.map((s, i) => {
        const dir = (s.direction||'buy').toLowerCase();
        const status = (s.status||'active').toLowerCase();
        const rr = calcRR(s.entry, s.sl, s.tp, dir);
        const delay = i * 0.06;
        return `
        <div class="signal-card ${dir} status-${status}" style="animation-delay:${delay}s">
          <div class="card-top">
            <span class="pair">${s.pair || '—'}</span>
            <span class="direction-badge ${dir}">${dir === 'buy' ? '▲ BUY' : '▼ SELL'}</span>
          </div>
          <div class="card-levels">
            <div class="level-box entry">
              <div class="level-lbl">Entry</div>
              <div class="level-val">${s.entry || '—'}</div>
            </div>
            <div class="level-box sl">
              <div class="level-lbl">SL</div>
              <div class="level-val">${s.sl || '—'}</div>
            </div>
            <div class="level-box tp">
              <div class="level-lbl">TP</div>
              <div class="level-val">${s.tp || '—'}</div>
            </div>
          </div>
          <div class="rr-row">
            ${rr ? `<span class="rr-badge">R:R ${rr}</span>` : '<span></span>'}
            <span class="card-time">${timeAgo(s.timestamp)}</span>
          </div>
          <div class="status-row">
            <span class="status-badge ${status}">${statusLabel(status)}</span>
          </div>
          ${s.comment ? `<div class="comment-text"><span data-icon="chat"></span> ${s.comment}</div>` : ''}
        </div>`;
      }).join('');
    }

    function updateStats(signals){
      const total  = signals.length;
      const active = signals.filter(s => s.status === 'active').length;
      const wins   = signals.filter(s => s.status === 'win').length;
      const closed = signals.filter(s => s.status === 'win' || s.status === 'loss').length;
      const wr     = closed ? Math.round(wins/closed*100) : null;

      document.getElementById('statTotal').textContent  = total;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statWin').textContent    = wins;
      document.getElementById('statWR').textContent     = wr !== null ? wr + '%' : '—';
    }

    // الاستماع للتحديثات الفورية
    const signalsRef = ref(db, 'signals');
    onValue(signalsRef, (snapshot) => {
      const data = snapshot.val();
      const signals = data ? Object.values(data) : [];
      renderCards(signals);
      updateStats(signals);
    });
  </script>

</body>
</html>
